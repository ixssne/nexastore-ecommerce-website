<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Signup</title>

    <style>

        body{
            font-family:Arial;
            background:#0f172a;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            color:white;
        }

        .box{
            background:#1e293b;
            padding:40px;
            border-radius:12px;
            width:350px;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:12px;
            border:none;
            border-radius:8px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>Create Account</h1>

    <form method="POST" action="/signup">

        <input
                type="text"
                name="username"
                placeholder="Username"
                required
        >

        <input
                type="email"
                name="email"
                placeholder="Email"
                required
        >

        <input
                type="password"
                name="password"
                placeholder="Password"
                required
        >

        <button type="submit">
            Signup
        </button>

    </form>

</div>

</body>
</html>
