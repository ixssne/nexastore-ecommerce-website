<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Login</title>

    <style>

        body{
            font-family: Arial;
            background:#111827;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            background:#1f2937;
            padding:40px;
            border-radius:12px;
            width:350px;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:10px;
            border:none;
            border-radius:8px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }

        .error{
            color:red;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>Login</h1>

    <p class="error" th:text="${error}"></p>

    <form action="/login" method="post">

        <input
                type="email"
                name="email"
                placeholder="Email"
                required
        >

        <input
                type="password"
                name="password"
                placeholder="Password"
                required
        >

        <button type="submit">
            Login
        </button>

    </form>

</div>

</body>
</html>
